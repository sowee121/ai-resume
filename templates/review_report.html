<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=750" />
  <title>简历优化诊断</title>
  {{favicon_link}}
  <style>
    @page { margin: 0; }
    @media print { html, body { width: 750px; } }
    html, body { overflow: visible !important; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      background: linear-gradient(165deg, #eef2ff 0%, #fdf4ff 45%, #fff7ed 100%);
    }
    /* 间距刻度：主 12 / 次 8；兄弟间距用 gap，容器内边距保留 */
    body {
      width: 750px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      font-family: "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
      background: linear-gradient(165deg, #eef2ff 0%, #fdf4ff 45%, #fff7ed 100%);
      color: #1e1b4b;
      -webkit-font-smoothing: antialiased;
    }

    .hero {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: {{header_gradient}};
      padding: 12px;
      color: #fff;
      border-radius: 0 0 24px 24px;
    }
    .hero-top {
      display: none;
    }
    .score-label {
      flex: 0 0 auto;
      align-self: center;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      background: rgba(255,255,255,0.22);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 13px;
      padding: 4px 8px;
      line-height: 1.3;
    }
    .hero-score-row {
      display: flex;
      align-items: flex-end;
      gap: 12px;
    }
    .score-mark {
      flex: 0 0 auto;
      display: flex;
      align-items: baseline;
      gap: 4px;
      line-height: 0.9;
    }
    .score-num {
      font-family: "Avenir Next Condensed", "Arial Narrow", "Helvetica Neue", "PingFang SC", sans-serif;
      font-size: 68px;
      font-weight: 700;
      letter-spacing: -0.045em;
      font-variant-numeric: tabular-nums;
      color: #fff;
      text-shadow: 0 4px 20px rgba(0,0,0,0.12);
    }
    .score-unit {
      font-size: 15px;
      font-weight: 600;
      color: rgba(255,255,255,0.8);
      transform: translateY(-6px);
    }
    .hero-titles {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-bottom: 4px;
    }
    .hero h1 {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.2;
    }
    .hero-sub {
      font-size: 13px;
      color: rgba(255,255,255,0.8);
      line-height: 1.3;
    }
    .score-rail {
      height: 6px;
      background: rgba(255,255,255,0.22);
      border-radius: 999px;
      overflow: hidden;
    }
    .score-rail-fill {
      height: 100%;
      width: {{score}}%;
      background: #fff;
      border-radius: 999px;
      box-shadow: 0 0 12px rgba(255,255,255,0.45);
    }

    .content {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-radius: 16px;
      padding: 12px;
    }
    .card-hit {
      background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
      border: 1px solid #a7f3d0;
    }
    .card-miss {
      background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
      border: 1px solid #fed7aa;
    }
    .card-warn {
      background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 100%);
      border: 1px solid #c7d2fe;
    }
    .card-dim {
      background: linear-gradient(135deg, #faf5ff 0%, #f3e8ff 100%);
      border: 1px solid #e9d5ff;
    }
    .card-action {
      background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
      border: 1px solid #bfdbfe;
    }

    .card-head {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .card-head > div {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .card-icon {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9px;
      font-size: 16px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .icon-hit { background: #10b981; color: #fff; }
    .icon-miss { background: #f59e0b; color: #fff; }
    .icon-warn { background: #6366f1; color: #fff; }
    .icon-dim { background: #8b5cf6; color: #fff; }
    .icon-action { background: #3b82f6; color: #fff; }

    .card-title {
      font-size: 17px;
      font-weight: 700;
      color: #1e293b;
      line-height: 1.25;
    }
    .card-desc {
      font-size: 12px;
      color: #64748b;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .tag {
      display: flex;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 16px;
      color: #fff;
    }
    .tag-hit {
      background: #059669;
      box-shadow: 0 2px 8px rgba(5,150,105,0.25);
    }
    .tag-miss {
      background: #d97706;
      box-shadow: 0 2px 8px rgba(217,119,6,0.2);
    }
    .tag-empty {
      background: rgba(0,0,0,0.06);
      color: #94a3b8;
      font-weight: 500;
    }

    .list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .list li {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 14px;
      line-height: 1.35;
      color: #334155;
      padding: 8px;
      background: rgba(255,255,255,0.7);
      border-radius: 10px;
    }
    .list li::before {
      content: "\203A";
      flex: 0 0 auto;
      font-size: 18px;
      line-height: 1;
      font-weight: 700;
    }
    .card-warn .list li::before { color: #6366f1; }
    .card-action .list li::before { color: #2563eb; }

    .dim-list { display: flex; flex-direction: column; gap: 8px; }
    .dim-item {
      background: rgba(255,255,255,0.75);
      border-radius: 12px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .dim-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .dim-name {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
      color: #1e293b;
      line-height: 1.3;
      flex: 1 1 auto;
      min-width: 0;
    }
    .dim-hint {
      font-size: 12px;
      font-weight: 400;
      color: #94a3b8;
    }
    .dim-score {
      font-size: 13px;
      font-weight: 700;
      color: #8b5cf6;
      flex-shrink: 0;
    }
    .dim-bar {
      height: 5px;
      background: rgba(139, 92, 246, 0.12);
      border-radius: 6px;
      overflow: hidden;
    }
    .dim-fill {
      height: 100%;
      background: linear-gradient(90deg, #a78bfa 0%, #c4b5fd 100%);
      border-radius: 6px;
    }
    .dim-comment {
      font-size: 13px;
      line-height: 1.3;
      color: #64748b;
    }

    /* print 必须写在后面：无 media 的规则也会作用于 print，后写才能盖住放大样式 */
    @media print {
      html, body { width: 750px; }
      .score-label { font-size: 18px; padding: 4px 8px; border-radius: 14px; }
      .hero { padding: 12px; gap: 8px; border-radius: 0 0 28px 28px; }
      .hero-score-row { gap: 12px; }
      .score-num { font-size: 95px; }
      .score-unit { font-size: 21px; transform: translateY(-8px); }
      .hero-titles { gap: 2px; padding-bottom: 4px; }
      .hero h1 { font-size: 31px; }
      .hero-sub { font-size: 18px; }
      .score-rail { height: 7px; }
      .content { padding: 12px; gap: 12px; }
      .card { border-radius: 18px; padding: 12px; gap: 8px; }
      .card-head { gap: 8px; }
      .card-icon { width: 44px; height: 44px; border-radius: 10px; font-size: 22px; }
      .card-title { font-size: 24px; }
      .card-desc { font-size: 17px; }
      .tags { gap: 8px; }
      .tag { font-size: 18px; padding: 4px 8px; border-radius: 18px; }
      .list { gap: 8px; }
      .list li { gap: 8px; font-size: 20px; line-height: 1.3; padding: 8px; border-radius: 11px; }
      .list li::before { font-size: 25px; }
      .dim-list { gap: 8px; }
      .dim-item { border-radius: 12px; padding: 8px; gap: 8px; }
      .dim-head { gap: 8px; }
      .dim-name { font-size: 20px; gap: 8px; }
      .dim-hint { font-size: 17px; }
      .dim-score { font-size: 18px; }
      .dim-bar { height: 6px; }
      .dim-comment { font-size: 18px; line-height: 1.25; }
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="hero-score-row">
      <div class="score-mark">
        <span class="score-num">{{score}}</span>
        <span class="score-unit">分</span>
      </div>
      <div class="hero-titles">
        <h1>{{title}}</h1>
        <div class="hero-sub">{{hero_sub}}</div>
      </div>
      <span class="score-label">{{score_label}}</span>
    </div>
    <div class="score-rail" aria-hidden="true">
      <div class="score-rail-fill"></div>
    </div>
  </div>

  <div class="content">
    <div class="card card-hit">
      <div class="card-head">
        <span class="card-icon icon-hit">✓</span>
        <div>
          <div class="card-title">核心优势</div>
          <div class="card-desc">简历已具备的亮点与竞争力</div>
        </div>
      </div>
      <div class="tags">{{strength_tags}}</div>
    </div>

    <div class="card card-miss">
      <div class="card-head">
        <span class="card-icon icon-miss">✦</span>
        <div>
          <div class="card-title">可优化项</div>
          <div class="card-desc">可提升筛选通过率与面试表现的方向</div>
        </div>
      </div>
      <div class="tags">{{weakness_tags}}</div>
    </div>

    <div class="card card-dim">
      <div class="card-head">
        <span class="card-icon icon-dim">▲</span>
        <div>
          <div class="card-title">六维评分</div>
          <div class="card-desc">ATS / 结构 / 量化 / 技能 / 语言 / 亮点</div>
        </div>
      </div>
      <div class="dim-list">{{dimension_items}}</div>
    </div>

    <div class="card card-warn">
      <div class="card-head">
        <span class="card-icon icon-warn">★</span>
        <div>
          <div class="card-title">优化建议</div>
          <div class="card-desc">建议优先补强与调整的表述</div>
        </div>
      </div>
      <ul class="list">{{suggestion_items}}</ul>
    </div>

    <div class="card card-action">
      <div class="card-head">
        <span class="card-icon icon-action">→</span>
        <div>
          <div class="card-title">下一步行动</div>
          <div class="card-desc">投递前建议完成的事项</div>
        </div>
      </div>
      <ul class="list">{{step_items}}</ul>
    </div>
  </div>
</body>
</html>
