<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=750" />
  <title>简历改动对比</title>
  {{favicon_link}}
  <style>
    @page { margin: 0; }
    @media print { html, body { width: 750px; } }
    html, body { overflow: visible !important; }
    .section-card, .subsection, .pair { break-inside: avoid; page-break-inside: avoid; }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #0f3f3a;
      --ink-soft: #3d5c58;
      --line: #b6e2dc;
      --line-soft: #d7efeb;
      --surface: rgba(255, 255, 255, 0.82);
      --surface-strong: #ffffff;
      --teal: #0f766e;
      --cyan: #0891b2;
      --blue: #2563eb;
      --chip: #ecfeff;
      --chip-ink: #0e7490;
      --del-bg: #ffe4e1;
      --del-ink: #9f1239;
      --add-bg: #d1fae5;
      --add-ink: #065f46;
      --note: #5b7a76;
      --page: linear-gradient(165deg, #e6fffa 0%, #ecfeff 42%, #eff6ff 100%);
      --hero: linear-gradient(135deg, #0f766e 0%, #0891b2 55%, #2563eb 100%);
      --head: linear-gradient(90deg, #ccfbf1 0%, #cffafe 55%, #dbeafe 100%);
      --radius: 18px;
      --radius-sm: 12px;
      --space: 10px;
      --space-sm: 8px;
    }

    html { background: var(--page); }
    body {
      width: 750px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
      background: var(--page);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    /* 兄弟间距用 gap；容器内边距保留 */
    .hero {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      background: var(--hero);
      padding: var(--space);
      color: #fff;
      border-radius: 0 0 24px 24px;
    }
    .hero-badge { display: none; }
    .hero-intro {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .hero h1 {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.25;
    }
    .hero-sub {
      font-size: 13px;
      opacity: 0.88;
      line-height: 1.3;
    }
    .hero-note {
      font-size: 12px;
      line-height: 1.3;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 10px;
      padding: var(--space-sm);
    }

    .score-strip {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      border-top: 1px solid rgba(255,255,255,0.22);
      padding-top: var(--space-sm);
    }
    .score-top {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: var(--space);
    }
    .score-main-wrap {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      padding-right: var(--space);
      border-right: 1px solid rgba(255,255,255,0.2);
    }
    .score-kicker {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.6px;
      opacity: 0.72;
    }
    .score-main,
    .score-compare {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 4px;
      line-height: 1;
    }
    .score-before {
      font-size: 26px;
      font-weight: 700;
      opacity: 0.72;
      letter-spacing: -0.5px;
    }
    .score-arrow {
      font-size: 18px;
      font-weight: 600;
      opacity: 0.55;
    }
    .score-now {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -1px;
    }
    .score-unit {
      font-size: 14px;
      font-weight: 600;
      opacity: 0.8;
    }
    .score-delta {
      font-size: 13px;
      font-weight: 700;
      opacity: 0.95;
    }
    .score-delta.flat { opacity: 0.55; }
    .score-dims {
      display: flex;
      align-items: stretch;
      min-width: 0;
      gap: 0;
    }
    .dim-chip {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
      padding: 0 6px;
      border-right: 1px solid rgba(255,255,255,0.16);
      text-align: center;
    }
    .dim-chip:last-child { border-right: none; }
    .dim-chip .n {
      font-size: 13px;
      opacity: 0.68;
      letter-spacing: 0.2px;
      white-space: nowrap;
    }
    .dim-chip .vals {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 2px;
      line-height: 1.2;
    }
    .dim-chip .b {
      font-size: 14px;
      font-weight: 600;
      opacity: 0.65;
    }
    .dim-chip .arr {
      font-size: 12px;
      font-weight: 600;
      opacity: 0.5;
    }
    .dim-chip .s {
      font-size: 17px;
      font-weight: 700;
    }
    .dim-chip .d { display: none; }
    .score-tags {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-sm);
    }
    .score-tag {
      font-size: 12px;
      line-height: 1.3;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.26);
      color: #fff;
    }

    .content {
      padding: var(--space);
      display: flex;
      flex-direction: column;
      gap: var(--space);
    }

    .section-card {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      background: linear-gradient(180deg, #ffffff 0%, #f0fdfa 100%);
    }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-sm);
      background: var(--head);
      border-bottom: 1px solid var(--line-soft);
      padding: var(--space-sm);
    }
    .section-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--teal);
    }
    .section-count {
      font-size: 12px;
      font-weight: 600;
      color: var(--chip-ink);
      background: var(--chip);
      border-radius: 999px;
      padding: 4px 8px;
    }

    .subsection {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      padding: var(--space-sm) var(--space);
      border-bottom: 1px solid var(--line-soft);
    }
    .subsection:last-child { border-bottom: none; }
    .subsection-head {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      font-size: 13px;
      font-weight: 700;
      color: var(--cyan);
    }
    .subsection-head::before {
      content: "";
      width: 3px;
      height: 12px;
      border-radius: 2px;
      background: linear-gradient(180deg, var(--teal), var(--cyan));
      flex: 0 0 auto;
    }

    .pair {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: var(--surface-strong);
    }
    .pair-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-soft);
      background: linear-gradient(90deg, #f0fdfa 0%, #ecfeff 100%);
      border-bottom: 1px solid var(--line-soft);
      padding: var(--space-sm);
    }

    .line {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: start;
      gap: var(--space-sm);
      font-size: 13px;
      line-height: 1.35;
      padding: var(--space-sm);
      word-break: break-word;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .mark {
      text-align: left;
      font-weight: 700;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      user-select: none;
      line-height: 1.35;
    }
    .line-del {
      background: var(--del-bg);
      color: var(--del-ink);
    }
    .line-del .mark { color: #e11d48; }
    .line-add {
      background: var(--add-bg);
      color: var(--add-ink);
    }
    .line-add .mark { color: #059669; }

    .pair-note {
      font-size: 12px;
      line-height: 1.3;
      color: var(--note);
      background: linear-gradient(90deg, #f8fffd 0%, #f5fcff 100%);
      border-top: 1px solid var(--line-soft);
      padding: var(--space-sm);
    }
    .pair-note-label {
      font-weight: 400;
      color: #6b8f8a;
    }

    /* print 必须写在后面：无 media 的规则也会作用于 print，后写才能盖住放大样式 */
    @media print {
      html, body { width: 750px; }
      .hero { padding: 10px; gap: 8px; border-radius: 0 0 28px 28px; }
      .hero-intro { gap: 4px; }
      .hero h1 { font-size: 31px; }
      .hero-sub { font-size: 18px; }
      .hero-note { font-size: 17px; border-radius: 10px; padding: 8px; }
      .score-strip { gap: 8px; padding-top: 8px; }
      .score-top { gap: 10px; }
      .score-main-wrap { padding-right: 10px; gap: 4px; }
      .score-kicker { font-size: 18px; }
      .score-before { font-size: 36px; }
      .score-arrow { font-size: 25px; }
      .score-now { font-size: 53px; }
      .score-unit { font-size: 20px; }
      .score-delta { font-size: 18px; }
      .dim-chip { padding: 0 6px; gap: 2px; }
      .dim-chip .n { font-size: 18px; }
      .dim-chip .b { font-size: 20px; }
      .dim-chip .arr { font-size: 17px; }
      .dim-chip .s { font-size: 24px; }
      .score-tags { gap: 8px; }
      .score-tag { font-size: 17px; padding: 4px 8px; }
      .content { padding: 10px; gap: 10px; }
      .section-head { gap: 8px; padding: 8px; }
      .section-title { font-size: 21px; }
      .section-count { font-size: 17px; padding: 4px 8px; }
      .subsection { gap: 8px; padding: 8px 10px; }
      .subsection-head { gap: 8px; font-size: 18px; }
      .subsection-head::before { width: 3px; height: 13px; }
      .pair-label { font-size: 17px; padding: 8px; }
      .line {
        grid-template-columns: auto 1fr;
        gap: 8px;
        font-size: 18px;
        line-height: 1.3;
        padding: 8px;
      }
      .mark { text-align: left; }
      .pair-note { font-size: 17px; line-height: 1.25; padding: 8px; }
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="hero-intro">
      <h1>{{title}}</h1>
      <div class="hero-sub">{{meta}}</div>
    </div>
    {{pdf_note}}
    {{score_panel}}
  </div>

  <div class="content">
    {{items}}
  </div>
</body>
</html>
